name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build docs
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build
      - name: Build landing
        working-directory: landing
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R landing/dist/. site/
          cp -R docs/.vitepress/dist site/docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # Deploys the exact artifact the build job checked, to Cloudflare Pages project "rein-lang".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rein-lang.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name rein-lang --branch main
