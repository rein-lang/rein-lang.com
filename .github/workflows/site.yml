name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Read-only deploy key on tupe12334/rein, the private submodule.
          ssh-key: ${{ secrets.REIN_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rein
      - name: Generated pages match the rein submodule
        run: |
          node docs/scripts/generate-examples.mjs --check
          sh docs/scripts/check-cli-drift.sh
      - name: Build docs
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build
      - name: Build landing
        working-directory: landing
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R landing/dist/. site/
          cp -R docs/.vitepress/dist site/docs
          echo rein-lang.com > site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
