name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Brand files come from the assets submodule
        run: |
          for f in landing/public/favicon.svg landing/public/favicon.ico landing/public/apple-touch-icon.png landing/public/brand/* docs/public/logo.svg; do
            test -L "$f" || { echo "$f must be a symlink into assets/ (rein-lang/assets is the single source of truth)"; exit 1; }
            test -e "$f" || { echo "$f links to a missing file in assets/"; exit 1; }
          done
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build docs
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run docs:build
      - name: Build landing
        working-directory: landing
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R landing/dist/. site/
          cp -R docs/.vitepress/dist site/docs
      - name: No broken internal link or anchor
        run: python3 scripts/check-links.py site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  # Runs `rein check` on the code samples in the docs. It installs rein with the command that
  # Getting started gives the reader, so that command is tested too.
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the install command from Getting started
        id: install
        run: echo "command=$(grep -m1 '^cargo install --git' docs/getting-started.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: rein
        with:
          path: ~/.cargo/bin/rein
          key: rein-${{ runner.os }}-${{ hashFiles('docs/getting-started.md') }}
      - name: Install rein as Getting started says
        if: steps.rein.outputs.cache-hit != 'true'
        run: ${{ steps.install.outputs.command }}
      - name: Each complete sample passes rein check
        run: python3 scripts/check-samples.py

  # Deploys the exact artifact the build job checked, to Cloudflare Pages project "rein-lang".
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rein-lang.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name rein-lang --branch main
