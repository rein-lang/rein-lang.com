name: bump-rein

# Moves the rein submodule to rein main, regenerates the CLI and example pages,
# opens or updates the bump-rein pull request, and starts its build check.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: bump-rein

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the rein submodule to main
        env:
          REIN_DEPLOY_KEY: ${{ secrets.REIN_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/rein_key"
          printf '%s\n' "$REIN_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o StrictHostKeyChecking=accept-new"
          git submodule update --init --remote rein
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rein
      - name: Regenerate pages
        run: |
          sh docs/scripts/generate-cli.sh
          node docs/scripts/generate-examples.mjs
      - name: Open or update the bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "rein is already current."
            exit 0
          fi
          sha="$(git -C rein rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bump-rein
          git commit -m "chore: bump rein to $sha"
          git push --force origin bump-rein
          # A push made with GITHUB_TOKEN starts no workflow, so start the build check here.
          gh workflow run site.yml --ref bump-rein
          # Opening the PR needs the org setting "Allow GitHub Actions to create and approve pull requests".
          if ! gh pr view bump-rein --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head bump-rein --title "chore: bump rein to $sha" \
              --body "Moves the rein submodule to rein main ($sha) and regenerates the CLI and example pages. Merging deploys the site." \
              || echo "::warning::Could not open the PR. Open it from https://github.com/${GITHUB_REPOSITORY}/compare/main...bump-rein"
          fi
