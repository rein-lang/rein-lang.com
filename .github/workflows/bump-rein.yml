name: bump-rein

# Moves the rein submodule to rein main, regenerates the CLI and example pages,
# commits when anything changed, and starts the site deploy.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-rein

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the rein submodule to main
        env:
          REIN_DEPLOY_KEY: ${{ secrets.REIN_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/rein_key"
          printf '%s\n' "$REIN_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o StrictHostKeyChecking=accept-new"
          git submodule update --init --remote rein
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rein
      - name: Regenerate pages
        run: |
          sh docs/scripts/generate-cli.sh
          node docs/scripts/generate-examples.mjs
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "rein is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump rein to $(git -C rein rev-parse --short HEAD)"
          git push
          # A push made with GITHUB_TOKEN starts no workflow, so start the deploy here.
          gh workflow run site.yml --ref main
