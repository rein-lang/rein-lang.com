<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rein Open Graph card</title>
    <style>
      /* Colors match landing/src/styles/global.css (dark theme). */
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0c1018;
        color: #e6edf5;
        font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(#1c2330 1.2px, transparent 1.2px);
        background-size: 28px 28px;
      }
      .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 64px; height: 64px; }
      .brand span { font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
      h1 {
        margin: 44px 0 0; font-size: 70px; line-height: 1.04;
        font-weight: 800; letter-spacing: -0.03em;
      }
      .sub { margin: 26px 0 0; font-size: 30px; line-height: 1.3; color: #a3adbd; font-weight: 500; }
      .pill {
        display: inline-block; align-self: flex-start; margin-top: 40px; padding: 10px 20px;
        border: 2px solid #2dd4bf; border-radius: 999px;
        color: #2dd4bf; font-size: 22px; font-weight: 700;
      }

      .side { position: absolute; left: 696px; top: 0; bottom: 0; width: 432px; display: flex; flex-direction: column; justify-content: center; }
      .card-head {
        font-size: 17px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; color: #a3adbd; margin: 0 0 14px;
      }
      .card-head.accent { color: #2dd4bf; }

      .manual {
        height: 156px; box-sizing: border-box; padding: 20px 24px; margin-bottom: 30px;
        background: #151a23; border: 2px solid #2b3441; border-radius: 20px;
        opacity: 0.5;
      }
      .manual p { margin: 0 0 10px; font-size: 20px; line-height: 1.3; color: #a3adbd; }
      .manual p.shout { color: #e6edf5; font-weight: 700; }

      .app-card {
        height: 240px; box-sizing: border-box; padding: 22px 26px;
        background: #1b2230; border: 3px solid #2dd4bf; border-radius: 20px;
        box-shadow: 0 0 0 8px rgba(45, 212, 191, 0.12);
        display: flex; flex-direction: column;
      }
      .question { margin: 10px 0 18px; font-size: 32px; line-height: 1.2; font-weight: 800; }
      .answers { display: flex; gap: 14px; }
      .btn {
        flex: 1; text-align: center; padding: 13px 0; border-radius: 12px;
        font-size: 24px; font-weight: 700; border: 2px solid #2b3441; color: #e6edf5;
      }
      .btn.primary { background: #2dd4bf; border-color: #2dd4bf; color: #04201c; }
      .next {
        margin-top: auto; padding-top: 14px; border-top: 2px solid #2b3441;
        font-size: 22px; font-weight: 600; color: #e6edf5;
      }
      .next b { color: #2dd4bf; }
    </style>
  </head>
  <body>
    <div class="grid"></div>

    <div class="copy">
      <div class="brand">
        <img src="../../assets/logo.svg" alt="" />
        <span>Rein</span>
      </div>
      <h1>Give your agent apps, not manuals.</h1>
      <p class="sub">Rein programs ask one question at a time. Your agent cannot skip a step.</p>
      <span class="pill">Beta</span>
    </div>

    <div class="side" aria-hidden="true">
      <p class="card-head">Manual</p>
      <div class="manual">
        <p>Read all twelve sections first.</p>
        <p>Pick the step that fits the task.</p>
        <p class="shout">IMPORTANT: never skip the review.</p>
      </div>

      <p class="card-head accent">App</p>
      <div class="app-card">
        <div class="question">Do the tests pass?</div>
        <div class="answers">
          <div class="btn primary">Yes</div>
          <div class="btn">No</div>
        </div>
        <div class="next"><b>Next step:</b> open the pull request</div>
      </div>
    </div>
  </body>
</html>
